<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Object-Cover</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">Teste Object-Cover</h1>
    
    <div class="mb-8">
        <h2 class="text-lg font-semibold mb-2">Teste 1: Object-Cover com dimensões fixas</h2>
        <div class="w-64 h-64 bg-gray-200 overflow-hidden">
            <img src="/escala.jpg" alt="Teste" class="w-full h-full object-cover">
        </div>
    </div>
    
    <div class="mb-8">
        <h2 class="text-lg font-semibold mb-2">Teste 2: Object-Cover com CSS inline</h2>
        <div class="w-64 h-64 bg-gray-200 overflow-hidden">
            <img src="/escala.jpg" alt="Teste" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
    </div>
    
    <div class="mb-8">
        <h2 class="text-lg font-semibold mb-2">Teste 3: Sem Object-Cover (para comparação)</h2>
        <div class="w-64 h-64 bg-gray-200 overflow-hidden">
            <img src="/escala.jpg" alt="Teste" class="w-full h-full">
        </div>
    </div>
</body>
</html>
